[project]
name = "sim2cad"
version = "0.1.0"
description = "Export MuJoCo robot models (MJCF) to STEP CAD assemblies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "cadquery>=2.5",
    "trimesh>=4.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "mujoco-menagerie>=2026.10.4",
    "networkx>=3.7",
    "fast-simplification>=0.2.0",
]

[project.scripts]
sim2cad = "sim2cad.cli:app"

[project.optional-dependencies]
render = [
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
